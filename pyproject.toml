[project]
name = "kiwoom-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["requests>=2.31.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "config",
    "kiwoom_account",
    "kiwoom_api_client",
    "kiwoom_errors",
    "kiwoom_oauth",
    "kiwoom_order",
    "kiwoom_parse",
    "kiwoom_quote",
    "order_guard",
]
